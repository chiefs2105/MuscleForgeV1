 out+=`<section class="mf-active" id="mf-active"><div class="mf-tag">EXERCISE ${i+1} / ${items.length}</div><h2>${safe(e[0])}</h2><div class="mf-sub">${safe(e[3])} · ${safe(e[1])} sets · ${safe(e[2])} reps</div><div class="mf-info">${prev.length?'Last session: '+safe(prev.map(x=>x.reps).join(' / '))+' reps · '+safe(prev[0].weight)+' lb':'First session: choose a manageable load, keeping 2–3 reps in reserve.'}<br>${recommend(day,i,e)}</div>${tutorialLinks(e[0])}<div class="mf-actions"><button class="mf-action" onclick="mfQuickFill(${i})">↶ Last session</button><button class="mf-action" onclick="showExercise(${i})">ⓘ Form guide</button><button class="mf-action" onclick="startRest(90)">◷ Rest 1:30</button></div>`;
 out+=`<div class="mf-sethead"><span>SET</span><span>WEIGHT LB</span><span>REPS</span><span>RIR</span><span>DONE</span></div>`;
 for(let s=0;s<e[1];s++){const v=getLog(logDate,day,i,s);out+=`<div class="mf-setrow ${v.done?'isdone':''}" id="mf-row-${i}-${s}"><span class="mf-setnum">${s+1}</span><input id="mf-${i}-${s}-weight" aria-label="Set ${s+1} weight in pounds" type="number" inputmode="decimal" min="0" step="0.5" placeholder="—" value="${safe(v.weight??'')}" oninput="setLog(${i},${s},'weight',this.value)"><input id="mf-${i}-${s}-reps" aria-label="Set ${s+1} repetitions" type="number" inputmode="numeric" min="0" step="1" placeholder="—" value="${safe(v.reps??'')}" oninput="setLog(${i},${s},'reps',this.value)"><input id="mf-${i}-${s}-rir" aria-label="Set ${s+1} reps in reserve" type="number" inputmode="numeric" min="0" max="10" step="1" placeholder="2" value="${safe(v.rir??'')}" oninput="setLog(${i},${s},'rir',this.value)"><input type="checkbox" aria-label="Mark set ${s+1} complete" ${v.done?'checked':''} onchange="mfSetDone(${i},${s},this.checked)"></div>`}
 out+=`<div class="mf-stepper"><button onclick="mfAdjust(${i},0,'weight',-2.5)" aria-label="Decrease first set weight">− 2.5 lb</button><span>Adjust first set</span><button onclick="mfAdjust(${i},0,'weight',2.5)" aria-label="Increase first set weight">+ 2.5 lb</button></div><button class="mf-next" onclick="mfNextExercise()">${i+1<items.length?'Next exercise →':'Finish session ✓'}</button></section>`;
 out+=`<section class="card"><h2>Session notes</h2><p class="mf-sub">Record how the workout felt or any form adjustments.</p><textarea class="mf-notes" placeholder="How did training feel today?" oninput="db.notes[logDate+'|'+day]=this.value;save()">${safe(db.notes[logDate+'|'+day]||'')}</textarea></section><p class="mf-footnote">Entries save automatically on this device. For one-arm movements, log reps per side. For planks, enter seconds. Back up your data regularly in Settings.</p>`;
 $('main').innerHTML=out;
};
// Keep the active workout responsive when rotating an iPhone.
window.addEventListener('resize',()=>{if(page==='workouts')workouts()});

render();
</script></body></html>
